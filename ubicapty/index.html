<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UbicaPTY - Locales Comerciales en Panamá</title>

    <style>
        /* ========================================
           VARIABLES Y RESET
           ======================================== */
        :root {
            --color-primary: #222222;
            --color-secondary: #717171;
            --color-accent: #008489;
            --color-white: #ffffff;
            --color-bg: #f7f7f7;
            --color-border: #dddddd;
            --color-hover: #f1f1f1;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.08);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.12);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.16);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --sidebar-width: 360px;
            --transition: 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            color: var(--color-primary);
            background: var(--color-bg);
            overflow: hidden;
        }

        /* ========================================
           LAYOUT PRINCIPAL
           ======================================== */
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* ========================================
           SIDEBAR
           ======================================== */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--color-white);
            border-right: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
            z-index: 10;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px 20px 16px;
        }

        /* ========================================
           BARRA DE BÚSQUEDA
           ======================================== */
        .search-container {
            padding: 0 20px 16px;
            border-bottom: 1px solid var(--color-border);
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--color-primary);
            background: var(--color-bg);
            transition: all var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--color-primary);
            background: var(--color-white);
            box-shadow: var(--shadow-sm);
        }

        .search-input::placeholder {
            color: var(--color-secondary);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--color-secondary);
            pointer-events: none;
        }

        .search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border: none;
            background: var(--color-border);
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--color-secondary);
            transition: all var(--transition);
        }

        .search-clear:hover {
            background: var(--color-primary);
            color: var(--color-white);
        }

        .search-clear.visible {
            display: flex;
        }

        .search-results-info {
            font-size: 12px;
            color: var(--color-secondary);
            margin-top: 10px;
            display: none;
        }

        .search-results-info.visible {
            display: block;
        }

        /* ========================================
           FILTROS DEL MAPA
           ======================================== */
        .filters-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--color-bg);
            border-bottom: 1px solid var(--color-border);
            cursor: pointer;
            transition: background var(--transition);
        }

        .filters-toggle:hover {
            background: var(--color-hover);
        }

        .filters-toggle-text {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--color-secondary);
        }

        .filters-toggle-icon {
            width: 16px;
            height: 16px;
            transition: transform 0.2s ease;
        }

        .filters-toggle.active .filters-toggle-icon {
            transform: rotate(180deg);
        }

        .filters-panel {
            max-height: 0;
            overflow: hidden;
            background: var(--color-white);
            border-bottom: 1px solid var(--color-border);
            transition: max-height 0.3s ease;
        }

        .filters-panel.active {
            max-height: 300px;
        }

        .filters-content {
            padding: 16px 20px;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .filter-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--color-secondary);
            cursor: pointer;
            transition: all var(--transition);
            user-select: none;
        }

        .filter-chip:hover {
            border-color: var(--color-primary);
        }

        .filter-chip.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: var(--color-white);
        }

        .filter-chip-icon {
            font-size: 14px;
        }

        .filter-chip-text {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ========================================
           BÚSQUEDA DE COMPETENCIA
           ======================================== */
        .business-search-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            transition: all var(--transition);
        }

        .business-search-toggle:hover {
            filter: brightness(1.05);
        }

        .business-search-toggle-text {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: white;
        }

        .business-search-toggle-icon {
            width: 16px;
            height: 16px;
            color: white;
            transition: transform 0.2s ease;
        }

        .business-search-toggle.active .business-search-toggle-icon {
            transform: rotate(180deg);
        }

        .business-search-panel {
            max-height: 0;
            overflow: hidden;
            background: var(--color-white);
            border-bottom: 1px solid var(--color-border);
            transition: max-height 0.3s ease;
        }

        .business-search-panel.active {
            max-height: 400px;
        }

        .business-search-content {
            padding: 16px 20px;
        }

        .business-search-input-wrapper {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .business-search-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            color: var(--color-primary);
        }

        .business-search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .business-search-btn {
            padding: 10px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
        }

        .business-search-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .business-search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .business-results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .business-results-count {
            font-size: 12px;
            color: var(--color-secondary);
        }

        .business-results-clear {
            font-size: 12px;
            color: #667eea;
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
        }

        .business-results-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .business-result-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px;
            background: var(--color-bg);
            border-radius: var(--radius-sm);
            margin-bottom: 8px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .business-result-item:hover {
            background: #f0e6ff;
        }

        .business-result-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            flex-shrink: 0;
        }

        .business-result-info {
            flex: 1;
            min-width: 0;
        }

        .business-result-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--color-primary);
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .business-result-address {
            font-size: 11px;
            color: var(--color-secondary);
            line-height: 1.3;
        }

        .business-marker {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .business-marker:hover {
            transform: scale(1.15);
        }

        .business-search-examples {
            font-size: 11px;
            color: var(--color-secondary);
            margin-top: 8px;
        }

        .business-search-examples span {
            color: #667eea;
            cursor: pointer;
        }

        .business-search-examples span:hover {
            text-decoration: underline;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--color-secondary);
        }

        .no-results h4 {
            font-size: 16px;
            color: var(--color-primary);
            margin-bottom: 8px;
        }

        .no-results p {
            font-size: 14px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--color-primary);
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--color-accent);
        }

        .subtitle {
            font-size: 14px;
            color: var(--color-secondary);
            margin-top: 4px;
        }

        .plaza-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        /* ========================================
           TARJETAS DE PLAZA
           ======================================== */
        .plaza-card {
            background: var(--color-white);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all var(--transition);
        }

        .plaza-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--color-primary);
        }

        .plaza-card.active {
            border-color: var(--color-primary);
            background: var(--color-primary);
            color: var(--color-white);
        }

        .plaza-card.active .plaza-zona,
        .plaza-card.active .plaza-info {
            color: rgba(255,255,255,0.8);
        }

        .plaza-nombre {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .plaza-zona {
            font-size: 13px;
            color: var(--color-secondary);
            margin-bottom: 8px;
        }

        .plaza-info {
            font-size: 12px;
            color: var(--color-secondary);
            display: flex;
            gap: 12px;
        }

        .plaza-info span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ========================================
           MAPA
           ======================================== */
        .map-container {
            flex: 1;
            position: relative;
            background: var(--color-bg);
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Mensaje de error del mapa */
        .map-error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            padding: 40px;
            background: var(--color-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 400px;
        }

        .map-error h3 {
            color: #e63946;
            margin-bottom: 12px;
            font-size: 18px;
        }

        .map-error p {
            color: var(--color-secondary);
            font-size: 14px;
            line-height: 1.5;
        }

        /* ========================================
           MARKERS PERSONALIZADOS
           ======================================== */
        .custom-marker {
            background: var(--color-white);
            border: 2px solid var(--color-primary);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 600;
            color: var(--color-primary);
            white-space: nowrap;
            box-shadow: var(--shadow-md);
            transition: all var(--transition);
            cursor: pointer;
        }

        .custom-marker:hover {
            transform: scale(1.08);
            box-shadow: var(--shadow-lg);
        }

        .custom-marker.active {
            background: var(--color-primary);
            color: var(--color-white);
            transform: scale(1.1);
        }

        /* Markers de zona */
        .zone-marker {
            background: var(--color-primary);
            color: var(--color-white);
            border-radius: 12px;
            padding: 8px 12px;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            transition: all var(--transition);
            text-align: center;
        }

        .zone-marker:hover {
            transform: scale(1.08);
            background: var(--color-accent);
        }

        .zone-marker strong {
            display: block;
            font-size: 12px;
            font-weight: 700;
        }

        .zone-marker span {
            display: block;
            font-size: 10px;
            opacity: 0.85;
            margin-top: 2px;
        }


        /* ========================================
           DRAWER DE DETALLE
           ======================================== */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .drawer-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .drawer {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: var(--color-white);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 90%;
            max-width: 480px;
            max-height: 80vh;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 101;
        }

        .drawer.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            visibility: visible;
        }

        .drawer-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .drawer-title {
            font-size: 20px;
            font-weight: 700;
        }

        .drawer-zona {
            font-size: 14px;
            color: var(--color-secondary);
            margin-top: 4px;
        }

        .drawer-close {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--color-bg);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--color-secondary);
            transition: all var(--transition);
            flex-shrink: 0;
        }

        .drawer-close:hover {
            background: var(--color-border);
            color: var(--color-primary);
        }

        .drawer-content {
            padding: 16px 24px 24px;
            overflow-y: auto;
            max-height: calc(80vh - 100px);
        }

        .drawer-section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        /* ========================================
           TARJETAS DE LOCAL
           ======================================== */
        .local-card {
            background: var(--color-bg);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 12px;
        }

        .local-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .local-numero {
            font-size: 15px;
            font-weight: 600;
        }

        .local-precio {
            font-size: 16px;
            font-weight: 700;
            color: var(--color-accent);
        }

        .local-precio span {
            font-size: 12px;
            font-weight: 400;
            color: var(--color-secondary);
        }

        .local-details {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--color-secondary);
        }

        .btn-whatsapp {
            width: 100%;
            padding: 12px 16px;
            background: #25D366;
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-whatsapp:hover {
            background: #20bd5a;
            transform: translateY(-1px);
        }

        .btn-whatsapp svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* ========================================
           RESPONSIVE - MÓVIL
           ======================================== */
        @media (max-width: 768px) {
            .app-container {
                flex-direction: column-reverse;
            }

            .sidebar {
                width: 100%;
                height: auto;
                max-height: 45vh;
                border-right: none;
                border-top: 1px solid var(--color-border);
                border-radius: var(--radius-lg) var(--radius-lg) 0 0;
                box-shadow: 0 -4px 16px rgba(0,0,0,0.1);
            }

            .sidebar-header {
                padding: 16px 16px 12px;
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .sidebar-header::before {
                content: '';
                position: absolute;
                top: 8px;
                left: 50%;
                transform: translateX(-50%);
                width: 40px;
                height: 4px;
                background: var(--color-border);
                border-radius: 2px;
            }

            .logo {
                font-size: 22px;
            }

            .subtitle {
                display: none;
            }

            .search-container {
                padding: 0 12px 12px;
            }

            .search-input {
                padding: 10px 14px 10px 40px;
                font-size: 14px;
            }

            .filters-toggle {
                padding: 10px 12px;
            }

            .filters-content {
                padding: 12px;
            }

            .filters-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }

            .filter-chip {
                padding: 6px 10px;
                font-size: 11px;
            }

            .business-search-toggle {
                padding: 10px 12px;
            }

            .business-search-content {
                padding: 12px;
            }

            .business-search-input {
                font-size: 14px;
            }

            .business-results-list {
                max-height: 150px;
            }

            .plaza-list {
                padding: 12px;
            }

            .plaza-card {
                padding: 12px;
            }

            .map-container {
                height: 55vh;
            }

            .drawer {
                width: 95%;
                max-height: 85vh;
            }
        }

        /* ========================================
           LOADING STATE
           ======================================== */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--color-secondary);
        }

        .loading::after {
            content: '';
            width: 24px;
            height: 24px;
            border: 2px solid var(--color-border);
            border-top-color: var(--color-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- ========================================
         CONTENEDOR PRINCIPAL
         ======================================== -->
    <div class="app-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <h1 class="logo">Ubica<span>PTY</span></h1>
                <p class="subtitle">Locales disponibles en plazas de Panamá</p>
            </header>

            <!-- Barra de búsqueda -->
            <div class="search-container">
                <div class="search-box">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input
                        type="text"
                        class="search-input"
                        id="searchInput"
                        placeholder="Buscar plaza, zona o precio..."
                        autocomplete="off"
                    >
                    <button class="search-clear" id="searchClear" aria-label="Limpiar búsqueda">✕</button>
                </div>
                <p class="search-results-info" id="searchResultsInfo"></p>
            </div>

            <!-- Filtros del mapa -->
            <div class="filters-toggle" id="filtersToggle">
                <span class="filters-toggle-text">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                    </svg>
                    Mostrar en el mapa
                </span>
                <svg class="filters-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </div>
            <div class="filters-panel" id="filtersPanel">
                <div class="filters-content">
                    <div class="filters-grid" id="filtersGrid">
                        <!-- Generado por JavaScript -->
                    </div>
                </div>
            </div>

            <!-- Búsqueda de Competencia -->
            <div class="business-search-toggle" id="businessSearchToggle">
                <span class="business-search-toggle-text">

        // ========================================
        // CREAR MARKERS CON ZONAS (hover para ver locales)
        // ========================================
        let zoneMarkers = [];
        let zonasData = {};

        function crearMarkers() {
            // Agrupar plazas por zona
            PLAZAS.forEach(plaza => {
                const zonaNombre = plaza.zona.split('(')[0].trim().split('/')[0].trim();

                if (!zonasData[zonaNombre]) {
                    zonasData[zonaNombre] = {
                        nombre: zonaNombre,
                        plazas: [],
                        totalLocales: 0,
                        lat: 0,
                        lng: 0
                    };
                }
                zonasData[zonaNombre].plazas.push(plaza);
                zonasData[zonaNombre].totalLocales += plaza.locales.length;
                zonasData[zonaNombre].lat += plaza.lat;
                zonasData[zonaNombre].lng += plaza.lng;
            });

            // Crear markers individuales (ocultos)
            PLAZAS.forEach(plaza => {
                const precioMin = Math.min(...plaza.locales.map(l => l.precio));
                const zonaNombre = plaza.zona.split('(')[0].trim().split('/')[0].trim();

                const markerContent = document.createElement('div');
                markerContent.className = 'custom-marker';
                markerContent.innerHTML = `desde $${precioMin}/m²`;
                markerContent.dataset.plazaId = plaza.id;

                const marker = new google.maps.marker.AdvancedMarkerElement({
                    map: null, // Oculto
                    position: { lat: plaza.lat, lng: plaza.lng },
                    content: markerContent,
                    title: plaza.nombre
                });

                marker.addListener('click', () => {
                    seleccionarPlaza(plaza.id);
                });

                markers.push({
                    plazaId: plaza.id,
                    zonaNombre: zonaNombre,
                    marker: marker,
                    content: markerContent
                });
            });

            // Crear markers de zonas
            Object.values(zonasData).forEach(zona => {
                zona.lat = zona.lat / zona.plazas.length;
                zona.lng = zona.lng / zona.plazas.length;

                const markerContent = document.createElement('div');
                markerContent.className = 'zone-marker';
                markerContent.innerHTML = `
                    <strong>${zona.nombre}</strong>
                    <span>${zona.plazas.length} plaza${zona.plazas.length > 1 ? 's' : ''} · ${zona.totalLocales} locales</span>
                `;

                const marker = new google.maps.marker.AdvancedMarkerElement({
                    map: map,
                    position: { lat: zona.lat, lng: zona.lng },
                    content: markerContent,
                    title: zona.nombre
                });

                // Hover: mostrar locales de esta zona
                markerContent.addEventListener('mouseenter', () => {
                    mostrarLocalesZona(zona.nombre);
                });

                markerContent.addEventListener('mouseleave', () => {
                    ocultarLocalesZona(zona.nombre);
                });

                // Click: zoom a la zona
                marker.addListener('click', () => {
                    map.setCenter({ lat: zona.lat, lng: zona.lng });
                    map.setZoom(15);
                });

                zoneMarkers.push({
                    zonaNombre: zona.nombre,
                    marker: marker,
                    content: markerContent
                });
            });
        }

        function mostrarLocalesZona(zonaNombre) {
            markers.filter(m => m.zonaNombre === zonaNombre).forEach(m => {
                m.marker.map = map;

        function ocultarLocalesZona(zonaNombre) {
            markers.filter(m => m.zonaNombre === zonaNombre).forEach(m => {
                m.marker.map = null;

        }

            // Actualizar estado visual de tarjetas
            document.querySelectorAll('.plaza-card').forEach(card => {
                card.classList.toggle('active', card.dataset.plazaId === plazaId);
            });

            // Actualizar estado visual de markers
            markers.forEach(m => {
                m.content.classList.toggle('active', m.plazaId === plazaId);
            });

            // Mover el mapa a la plaza seleccionada
            map.panTo({ lat: plaza.lat, lng: plaza.lng });
            map.setZoom(15);

            // Mostrar el drawer con los detalles
            mostrarDrawer(plaza);
        }

        // ========================================
        // BÚSQUEDA
        // ========================================
        function configurarBusqueda() {
            const searchInput = document.getElementById('searchInput');
            const searchClear = document.getElementById('searchClear');
            const searchResultsInfo = document.getElementById('searchResultsInfo');

            // Evento de escritura en el campo de búsqueda
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();

                // Mostrar/ocultar botón de limpiar
                searchClear.classList.toggle('visible', query.length > 0);

                // Realizar búsqueda
                filtrarPlazas(query);
            });

            // Evento de limpiar búsqueda
            searchClear.addEventListener('click', () => {
                searchInput.value = '';
                searchClear.classList.remove('visible');
                filtrarPlazas('');
                searchInput.focus();
            });

            // Limpiar con tecla Escape
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    searchClear.classList.remove('visible');
                    filtrarPlazas('');
                }
            });
        }

        function filtrarPlazas(query) {
            const container = document.getElementById('plazaList');
            const searchResultsInfo = document.getElementById('searchResultsInfo');
            const queryLower = query.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

            // Si no hay búsqueda, mostrar todas
            if (!query) {
                document.querySelectorAll('.plaza-card').forEach(card => {
                    card.style.display = 'block';
                });
                searchResultsInfo.classList.remove('visible');

                // Mostrar todos los markers
                markers.forEach(m => {
                    m.marker.map = map;
                });
                return;
            }

            // Filtrar plazas
            let resultados = 0;
            const plazasVisibles = [];

            PLAZAS.forEach(plaza => {
                const card = document.querySelector(`.plaza-card[data-plaza-id="${plaza.id}"]`);
                const markerData = markers.find(m => m.plazaId === plaza.id);

                // Crear texto de búsqueda (nombre, zona, precios)
                const precioMin = Math.min(...plaza.locales.map(l => l.precio));
                const precioMax = Math.max(...plaza.locales.map(l => l.precio));
                const textoBusqueda = `
                    ${plaza.nombre}
                    ${plaza.zona}
                    $${precioMin} $${precioMax}
                    ${plaza.locales.map(l => l.numero).join(' ')}
                `.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

                // Verificar si coincide
                const coincide = textoBusqueda.includes(queryLower) ||
                                 buscarPorPrecio(queryLower, precioMin, precioMax);

                if (card) {
                    card.style.display = coincide ? 'block' : 'none';
                }

                // Mostrar/ocultar marker
                if (markerData) {
                    markerData.marker.map = coincide ? map : null;
                }

                if (coincide) {
                    resultados++;
                    plazasVisibles.push(plaza);
                }
            });

            // Mostrar información de resultados
            if (resultados === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <h4>Sin resultados</h4>
                        <p>No encontramos plazas para "${query}"</p>
                    </div>
                `;
                searchResultsInfo.classList.remove('visible');
            } else {
                // Regenerar las tarjetas si se había mostrado "sin resultados"
                if (container.querySelector('.no-results')) {
                    generarTarjetasPlazas();
                    filtrarPlazas(query); // Re-aplicar filtro
                    return;
                }

                searchResultsInfo.textContent = `${resultados} plaza${resultados !== 1 ? 's' : ''} encontrada${resultados !== 1 ? 's' : ''}`;
                searchResultsInfo.classList.add('visible');

                // Ajustar vista del mapa para mostrar resultados
                if (plazasVisibles.length > 0 && plazasVisibles.length < PLAZAS.length) {
                    ajustarVistaMapa(plazasVisibles);
                }
            }
        }

        // Buscar por rango de precio (ej: "menos de 40", "bajo 50", ">30")
        function buscarPorPrecio(query, precioMin, precioMax) {
            // Patrones de búsqueda de precio
            const patrones = [
                { regex: /menos de (\d+)/, fn: (val) => precioMin < val },
                { regex: /bajo (\d+)/, fn: (val) => precioMin < val },
                { regex: /menor a (\d+)/, fn: (val) => precioMin < val },
                { regex: /<\s*(\d+)/, fn: (val) => precioMin < val },
                { regex: /mas de (\d+)/, fn: (val) => precioMax > val },
                { regex: /mayor a (\d+)/, fn: (val) => precioMax > val },
                { regex: />\s*(\d+)/, fn: (val) => precioMax > val },
                { regex: /hasta (\d+)/, fn: (val) => precioMin <= val },
                { regex: /desde (\d+)/, fn: (val) => precioMin >= val },
                { regex: /barato/, fn: () => precioMin <= 30 },
                { regex: /economico/, fn: () => precioMin <= 35 },
                { regex: /lujo/, fn: () => precioMin >= 60 },
                { regex: /premium/, fn: () => precioMin >= 50 },
            ];

            for (const patron of patrones) {
                const match = query.match(patron.regex);
                if (match) {
                    const valor = match[1] ? parseInt(match[1]) : null;
                    return patron.fn(valor);
                }
            }

            return false;
        }

        // Ajustar la vista del mapa para mostrar los resultados
        function ajustarVistaMapa(plazas) {
            if (!map || plazas.length === 0) return;

            const bounds = new google.maps.LatLngBounds();
            plazas.forEach(plaza => {
                bounds.extend({ lat: plaza.lat, lng: plaza.lng });
            });

            map.fitBounds(bounds, { padding: 50 });

            // Si solo hay una plaza, hacer zoom más cercano
            if (plazas.length === 1) {
                setTimeout(() => map.setZoom(15), 300);
            }
        }

                grid.appendChild(chip);
            });
        }

        function buscarPOIs(filtro) {
            console.log('buscarPOIs llamado:', filtro);

            // Limpiar markers anteriores
            limpiarFilterMarkers();

            if (!placesService) {
                console.error('placesService no está inicializado');
                return;
            }

            // Usar textSearch - mismo método que funciona para competencia
            const request = {
                query: filtro.nombre + ' en Ciudad de Panama',
                location: new google.maps.LatLng(9.0, -79.5),
                radius: 30000
            };

            console.log('Request:', request);

            placesService.textSearch(request, (results, status) => {
                console.log('Respuesta Places API:', status, results ? results.length : 0);

                if (status === google.maps.places.PlacesServiceStatus.OK && results && results.length > 0) {
                    results.forEach(place => {
                        const lat = place.geometry.location.lat();
                        const lng = place.geometry.location.lng();

                        // Solo mostrar si está en Panamá
                        if (lat < 8.5 || lat > 9.5 || lng < -80 || lng > -79) return;

                        // Crear marker con el icono del filtro
                        const markerContent = document.createElement('div');
                        markerContent.style.cssText = `
                            background: white;
                            border: 2px solid #ddd;
                            border-radius: 50%;
                            width: 32px;
                            height: 32px;
                            display: flex;
                            align-items: center;
                            justify-content: center;
                            font-size: 16px;
                            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
                            cursor: pointer;
                        `;
                        markerContent.textContent = filtro.icon;

                        const marker = new google.maps.marker.AdvancedMarkerElement({
                            map: map,
                            position: place.geometry.location,
                            content: markerContent,
                            title: place.name
                        });

                        marker.addListener('click', () => {
                            map.panTo(place.geometry.location);
                            map.setZoom(17);
                        });

                        filterMarkers.push(marker);
                    });

                    console.log('Markers creados:', filterMarkers.length);
                } else {
                    console.log('Sin resultados o error:', status);
                }
            });
        }

        function limpiarFilterMarkers() {
            filterMarkers.forEach(marker => {
                marker.map = null;
            });
            filterMarkers = [];
        }

        // ========================================
        // BÚSQUEDA DE COMPETENCIA
        // ========================================
        function configurarBusquedaCompetencia() {
            const toggle = document.getElementById('businessSearchToggle');
            const panel = document.getElementById('businessSearchPanel');
            const input = document.getElementById('businessSearchInput');
            const btn = document.getElementById('businessSearchBtn');
            const clearBtn = document.getElementById('businessResultsClear');
            const examples = document.querySelectorAll('.business-search-examples span');

            // Toggle del panel
            toggle.addEventListener('click', () => {
                toggle.classList.toggle('active');
                panel.classList.toggle('active');
            });

            // Búsqueda al hacer clic en el botón
            btn.addEventListener('click', () => {
                const query = input.value.trim();
                if (query) buscarCompetencia(query);
            });

            // Búsqueda al presionar Enter
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const query = input.value.trim();
                    if (query) buscarCompetencia(query);
                }
            });

            // Ejemplos clickeables
            examples.forEach(example => {
                example.addEventListener('click', () => {
                    const query = example.dataset.query;
                    input.value = query;
                    buscarCompetencia(query);
                });
            });

            // Limpiar resultados
            clearBtn.addEventListener('click', limpiarResultadosCompetencia);
        }

        // Buscar en la base de datos local
        function buscarEnDBLocal(query) {
            const queryNorm = query.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();

            for (const [clave, valor] of Object.entries(CADENAS_PANAMA)) {
                // Si es un alias (string), resolver
                let ubicaciones = valor;
                if (typeof valor === 'string') {
                    ubicaciones = CADENAS_PANAMA[valor];
                }

                const claveNorm = clave.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

                // Coincidencia parcial
                if (claveNorm.includes(queryNorm) || queryNorm.includes(claveNorm)) {
                    if (Array.isArray(ubicaciones)) {
                        return { cadena: clave, ubicaciones: ubicaciones };
                    }
                }
            }
            return null;
        }

        function buscarCompetencia(query) {
            const btn = document.getElementById('businessSearchBtn');

            btn.disabled = true;
            btn.textContent = 'Buscando...';

            // Limpiar markers anteriores
            limpiarMarkersCompetencia();

            // Buscar primero en DB local
            const resultadoLocal = buscarEnDBLocal(query);

            if (resultadoLocal) {
                // Mostrar resultados de DB local
                btn.disabled = false;
                btn.textContent = 'Buscar';
                mostrarResultadosCompetencia(resultadoLocal.ubicaciones, resultadoLocal.cadena);
            } else {
                // Fallback a Google Places API
                const request = {
                    query: query + ' Panama City Panama',
                    location: new google.maps.LatLng(9.0, -79.5),
                    radius: 30000
                };

                placesService.textSearch(request, (results, status) => {
                    btn.disabled = false;
                    btn.textContent = 'Buscar';

                    if (status === google.maps.places.PlacesServiceStatus.OK && results.length > 0) {
                        const resultadosPanama = results.filter(place => {
                            const lat = place.geometry.location.lat();
                            const lng = place.geometry.location.lng();
                            return lat > 8.9 && lat < 9.2 && lng > -79.7 && lng < -79.3;
                        });

                        if (resultadosPanama.length > 0) {
                            // Convertir formato de Google a nuestro formato
                            const lugares = resultadosPanama.map(p => ({
                                nombre: p.name,
                                direccion: p.formatted_address || '',
                                lat: p.geometry.location.lat(),
                                lng: p.geometry.location.lng()
                            }));
                            mostrarResultadosCompetencia(lugares, query);
                        } else {
                            mostrarSinResultados(query);
                        }
                    } else {
                        mostrarSinResultados(query);
                    }
                });
            }
        }

        function mostrarResultadosCompetencia(lugares, query) {
            const resultsContainer = document.getElementById('businessResults');
            const resultsList = document.getElementById('businessResultsList');
            const resultsCount = document.getElementById('businessResultsCount');

            resultsContainer.style.display = 'block';
            resultsCount.textContent = `${lugares.length} ubicación${lugares.length !== 1 ? 'es' : ''} de "${query}"`;

            resultsList.innerHTML = '';

            const bounds = new google.maps.LatLngBounds();

            lugares.forEach((lugar, index) => {
                const position = { lat: lugar.lat, lng: lugar.lng };

                // Crear marker
                const markerContent = document.createElement('div');
                markerContent.className = 'business-marker';
                markerContent.textContent = index + 1;

                const marker = new google.maps.marker.AdvancedMarkerElement({
                    map: map,
                    position: position,
                    content: markerContent,
                    title: lugar.nombre
                });

                marker.addListener('click', () => {
                    map.panTo(position);
                    map.setZoom(17);
                });

                businessMarkers.push(marker);
                bounds.extend(position);

                // Crear item en lista
                const item = document.createElement('div');
                item.className = 'business-result-item';
                item.innerHTML = `
                    <div class="business-result-icon">${index + 1}</div>
                    <div class="business-result-info">
                        <div class="business-result-name">${lugar.nombre}</div>
                        <div class="business-result-address">${lugar.direccion}</div>
                    </div>
                `;

                item.addEventListener('click', () => {
                    map.panTo(position);
                    map.setZoom(17);
                });

                resultsList.appendChild(item);
            });

            map.fitBounds(bounds, { padding: 50 });
        }

        function mostrarSinResultados(query) {
            const resultsContainer = document.getElementById('businessResults');
            const resultsList = document.getElementById('businessResultsList');
            const resultsCount = document.getElementById('businessResultsCount');

            resultsContainer.style.display = 'block';
            resultsCount.textContent = `Sin resultados para "${query}"`;
            resultsList.innerHTML = `
                <div style="text-align: center; padding: 20px; color: var(--color-secondary);">
                    <p>No encontramos ubicaciones.</p>
                    <p style="font-size: 11px; margin-top: 8px;">Intenta con otro nombre o verifica la ortografía.</p>
                </div>
            `;
        }

        function limpiarMarkersCompetencia() {
            businessMarkers.forEach(marker => {
                marker.map = null;
            });
            businessMarkers = [];
        }

        function limpiarResultadosCompetencia() {
            const resultsContainer = document.getElementById('businessResults');
            const input = document.getElementById('businessSearchInput');

            limpiarMarkersCompetencia();
            resultsContainer.style.display = 'none';
            input.value = '';

            // Restaurar vista del mapa
            map.setCenter({ lat: 8.99, lng: -79.52 });
            map.setZoom(12);
        }

        // ========================================
        // MANEJO DE ERRORES DE CARGA
        // ========================================
        window.gm_authFailure = function() {
            mostrarErrorMapa('La API Key de Google Maps no es válida o no tiene los permisos necesarios.');
        };

        // Timeout para detectar si el mapa no carga
        setTimeout(() => {
            const mapElement = document.getElementById('map');
            if (mapElement.classList.contains('loading')) {
                mostrarErrorMapa('El mapa tardó demasiado en cargar. Verifica tu conexión.');
            }
        }, 15000);
    </script>

    <!-- Cargar Google Maps API -->
    <script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC65ByD4HRlt1N3royoeZtX6tkPFxmWBw0&libraries=marker,places&loading=async&callback=initMap"
        async
        defer
        onerror="mostrarErrorMapa('No se pudo cargar la API de Google Maps. Verifica tu conexión.')">
    </script>
