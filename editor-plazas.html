<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de plazas — Plaza Marketplace</title>
<style>
  :root{
    --bg:#f6f5f3; --panel:#fff; --border:#e3e0da; --text:#2a271f; --muted:#8a8477;
    --accent:#b5652f; --accent-soft:#f2e3d5; --danger:#b3492f; --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  .app{display:grid;grid-template-columns:320px 1fr;height:100vh;}
  .sidebar{border-right:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;overflow:hidden;}
  .sidebar-head{padding:16px 16px 10px;border-bottom:1px solid var(--border);}
  .sidebar-head h1{font-size:16px;margin:0 0 8px;}
  .stats{font-size:12px;color:var(--muted);margin-bottom:10px;}
  input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--bg);}
  .zonas{flex:1;overflow-y:auto;padding:6px 8px 24px;}
  .zona-head{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:14px 8px 4px;}
  .plaza-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;}
  .plaza-row:hover{background:var(--bg);}
  .plaza-row.active{background:var(--accent-soft);}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .dot.listo{background:#4c8c5b;}
  .dot.revisar{background:#c98a2c;}
  .dot.vacio{background:#c1bcb0;}
  .plaza-row .nombre{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .plaza-row .count{color:var(--muted);font-size:11.5px;}
  .main{overflow-y:auto;padding:28px 40px 60px;}
  .main-inner{max-width:760px;margin:0 auto;}
  .empty-state{max-width:420px;margin:80px auto;text-align:center;color:var(--muted);}
  .header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:6px;}
  .header-row h2{margin:0;font-size:22px;}
  .zona-tag{color:var(--muted);font-size:13px;margin-bottom:18px;}
  select.estado{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12.5px;background:var(--panel);color:var(--text);}
  .toolbar{display:flex;gap:8px;margin-bottom:6px;}
  button{font:inherit;cursor:pointer;}
  .btn{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--text);}
  .btn:hover{background:var(--bg);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{opacity:.92;}
  .btn.danger{color:var(--danger);}
  .btn.small{padding:4px 8px;font-size:12px;}
  .negocios{list-style:none;margin:18px 0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .negocio{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;}
  .negocio .nombre-negocio{flex:none;width:220px;border:none;background:transparent;font-size:14px;font-weight:600;padding:2px 4px;border-radius:6px;}
  .negocio .nombre-negocio:focus{background:var(--bg);outline:1px solid var(--border);}
  .chips{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:#7a4620;border-radius:999px;padding:3px 6px 3px 10px;font-size:12px;white-space:nowrap;}
  .chip button{background:none;border:none;color:#7a4620;cursor:pointer;font-size:13px;line-height:1;padding:0 2px;}
  .add-cat{border:1px dashed var(--border);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--muted);background:none;}
  .del-negocio{flex:none;background:none;border:none;color:var(--muted);font-size:16px;padding:2px 6px;border-radius:6px;}
  .del-negocio:hover{color:var(--danger);background:var(--bg);}
  .add-form{display:flex;gap:8px;align-items:center;background:var(--panel);border:1px dashed var(--border);border-radius:var(--radius);padding:10px 12px;margin-top:10px;}
  .add-form input[type=text]{border:1px solid var(--border);border-radius:8px;padding:7px 9px;font-size:13.5px;}
  .add-form .add-nombre{width:220px;}
  .add-form .add-cat-input{flex:1;}
  .cat-picker{position:relative;}
  .cat-menu{position:absolute;top:calc(100% + 4px);left:0;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.08);max-height:220px;overflow-y:auto;z-index:5;min-width:200px;padding:4px;}
  .cat-menu button{display:block;width:100%;text-align:left;padding:6px 8px;border:none;background:none;border-radius:6px;font-size:13px;}
  .cat-menu button:hover{background:var(--bg);}
  .hint{font-size:12px;color:var(--muted);margin-top:16px;}
  .modal-bg{position:fixed;inset:0;background:rgba(20,18,14,.4);display:flex;align-items:center;justify-content:center;z-index:20;}
  .modal{background:var(--panel);border-radius:14px;width:min(720px,92vw);max-height:82vh;display:flex;flex-direction:column;padding:20px;}
  .modal h3{margin:0 0 4px;}
  .modal .sub{color:var(--muted);font-size:13px;margin:0 0 14px;}
  .tabs{display:flex;gap:6px;margin-bottom:10px;}
  .tabs button{border:1px solid var(--border);background:var(--panel);border-radius:8px 8px 0 0;padding:6px 12px;font-size:13px;}
  .tabs button.active{background:var(--accent-soft);border-color:var(--accent-soft);font-weight:600;}
  textarea{width:100%;flex:1;min-height:320px;border:1px solid var(--border);border-radius:8px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;resize:vertical;background:var(--bg);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;}
  .hidden{display:none !important;}
  ::selection{background:var(--accent-soft);}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-head">
      <h1>Plazas — editor</h1>
      <div class="stats" id="stats"></div>
      <input type="search" id="buscar" placeholder="Buscar plaza o negocio…">
    </div>
    <div class="zonas" id="zonas"></div>
    <div style="padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;">
      <button class="btn primary" id="btn-exportar" style="flex:1">Exportar</button>
      <button class="btn danger" id="btn-reset" title="Volver a los datos originales">Reiniciar</button>
    </div>
  </div>
  <div class="main"><div class="main-inner" id="main-inner"></div></div>
</div>

<div class="modal-bg hidden" id="modal-bg">
  <div class="modal">
    <h3>Exportar datos</h3>
    <p class="sub">Copia esto y pásamelo cuando quieras que lo suba al sitio real y haga el commit.</p>
    <div class="tabs">
      <button class="tab-btn active" data-tab="md">Markdown</button>
      <button class="tab-btn" data-tab="json">JSON (para el sitio)</button>
    </div>
    <textarea id="export-text" readonly></textarea>
    <div class="modal-actions">
      <button class="btn" id="btn-cerrar-modal">Cerrar</button>
      <button class="btn" id="btn-descargar">Descargar archivo</button>
      <button class="btn primary" id="btn-copiar">Copiar</button>
    </div>
  </div>
</div>

const STORAGE_KEY = "plaza-marketplace-editor-v1";

function cargarDatos(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return JSON.parse(JSON.stringify(SEED));
}
function guardarDatos(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
}

let DATA = cargarDatos();
let plazaActivaId = null;
let filtro = "";

function todasLasPlazas(){
  return DATA.flatMap(z => z.plazas.map(p => ({...p, zona:z.zona})));
}
function encontrarPlaza(id){
  for(const z of DATA) for(const p of z.plazas) if(p.id===id) return {plaza:p, zona:z.zona};
  return null;
}

function pintarSidebar(){
  const cont = document.getElementById("zonas");
  cont.innerHTML = "";
  const f = filtro.trim().toLowerCase();
  let total=0, listas=0;
  for(const z of DATA){
    const plazasFiltradas = z.plazas.filter(p=>{
      if(!f) return true;
      if(p.nombre.toLowerCase().includes(f)) return true;
      return p.tenants.some(t=>t.n.toLowerCase().includes(f));
    });
    total += z.plazas.length;
    listas += z.plazas.filter(p=>p.estado==="listo").length;
    if(!plazasFiltradas.length) continue;
    const head = document.createElement("div");
    head.className = "zona-head";
    head.textContent = z.zona;
    cont.appendChild(head);
    for(const p of plazasFiltradas){
      const row = document.createElement("div");
      row.className = "plaza-row" + (p.id===plazaActivaId ? " active" : "");
      row.innerHTML = `<span class="dot ${p.estado}"></span><span class="nombre">${escapeHtml(p.nombre)}</span><span class="count">${p.tenants.length}</span>`;
      row.addEventListener("click", ()=>{ plazaActivaId = p.id; render(); });
      cont.appendChild(row);
    }
  }
  document.getElementById("stats").textContent = `${listas}/${total} plazas listas · ${todasLasPlazas().reduce((n,p)=>n+p.tenants.length,0)} negocios`;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function pintarPrincipal(){
  const cont = document.getElementById("main-inner");
  if(!plazaActivaId){
    cont.innerHTML = `<div class="empty-state"><p>Elegí una plaza de la izquierda para ver y editar sus negocios.</p></div>`;
    return;
  }
  const found = encontrarPlaza(plazaActivaId);
  if(!found){ plazaActivaId=null; return pintarPrincipal(); }
  const {plaza, zona} = found;

  cont.innerHTML = "";

  const headerRow = document.createElement("div");
  headerRow.className = "header-row";
  headerRow.innerHTML = `<div><h2>${escapeHtml(plaza.nombre)}</h2><div class="zona-tag">${escapeHtml(zona)}</div></div>`;
  const selEstado = document.createElement("select");
  selEstado.className = "estado";
  for(const key of ["listo","revisar","vacio"]){
    const opt = document.createElement("option");
    opt.value = key; opt.textContent = ESTADO_LABEL[key];
    if(plaza.estado===key) opt.selected = true;
    selEstado.appendChild(opt);
  }
  selEstado.addEventListener("change", ()=>{ plaza.estado = selEstado.value; guardarDatos(); pintarSidebar(); });
  headerRow.appendChild(selEstado);
  cont.appendChild(headerRow);

  const ul = document.createElement("ul");
  ul.className = "negocios";
  plaza.tenants.forEach((t, idx) => ul.appendChild(filaNegocio(plaza, t, idx)));
  cont.appendChild(ul);

  cont.appendChild(formularioAgregar(plaza));

  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = "Los cambios se guardan solos en este navegador. Usá \"Exportar\" cuando quieras pasarme los datos.";
  cont.appendChild(hint);
}

function filaNegocio(plaza, t, idx){
  const li = document.createElement("li");
  li.className = "negocio";

  const nombreInput = document.createElement("input");
  nombreInput.className = "nombre-negocio";
  nombreInput.value = t.n;
  nombreInput.addEventListener("change", ()=>{ t.n = nombreInput.value.trim() || t.n; guardarDatos(); pintarSidebar(); });
  li.appendChild(nombreInput);

  const chips = document.createElement("div");
  chips.className = "chips";
  t.cat.forEach((c, ci) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = `${escapeHtml(c)} `;
    const rm = document.createElement("button");
    rm.textContent = "×";
    rm.title = "Quitar categoría";
    rm.addEventListener("click", ()=>{
      if(t.cat.length<=1){ alert("Un negocio necesita al menos una categoría."); return; }
      t.cat.splice(ci,1); guardarDatos(); render();
    });
    chip.appendChild(rm);
    chips.appendChild(chip);
  });
  const addCatBtn = document.createElement("button");
  addCatBtn.className = "add-cat";
  addCatBtn.textContent = "+ categoría";
  addCatBtn.addEventListener("click", (e)=> abrirCatMenu(e.currentTarget, (cat)=>{
    if(!t.cat.includes(cat)) t.cat.push(cat);
    guardarDatos(); render();
  }));
  chips.appendChild(addCatBtn);
  li.appendChild(chips);

  const del = document.createElement("button");
  del.className = "del-negocio";
  del.textContent = "🗑";
  del.title = "Quitar negocio";
  del.addEventListener("click", ()=>{
    if(!confirm(`¿Quitar "${t.n}" de esta plaza?`)) return;
    plaza.tenants.splice(idx,1); guardarDatos(); render();
  });
  li.appendChild(del);

  return li;
}

function abrirCatMenu(anchorEl, onPick){
  cerrarCatMenu();
  const wrap = document.createElement("div");
  wrap.className = "cat-picker";
  wrap.style.position = "absolute";
  const rect = anchorEl.getBoundingClientRect();
  wrap.style.left = (rect.left + window.scrollX) + "px";
  wrap.style.top = (rect.bottom + window.scrollY + 4) + "px";
  const menu = document.createElement("div");
  menu.className = "cat-menu";
  menu.id = "cat-menu-flotante";
  CATEGORIAS.forEach(c=>{
    const b = document.createElement("button");
    b.textContent = c;
    b.addEventListener("click", ()=>{ onPick(c); cerrarCatMenu(); });
    menu.appendChild(b);
  });
  wrap.appendChild(menu);
  wrap.style.position = "fixed";
  document.body.appendChild(wrap);
  wrap.id = "cat-picker-flotante";
  setTimeout(()=> document.addEventListener("click", cerrarCatMenuFuera), 0);
}
function cerrarCatMenu(){
  const el = document.getElementById("cat-picker-flotante");
  if(el) el.remove();
  document.removeEventListener("click", cerrarCatMenuFuera);
}
function cerrarCatMenuFuera(e){
  const el = document.getElementById("cat-picker-flotante");
  if(el && !el.contains(e.target)) cerrarCatMenu();
}

function formularioAgregar(plaza){
  const wrap = document.createElement("div");
  wrap.className = "add-form";

  const nombreInput = document.createElement("input");
  nombreInput.type = "text";
  nombreInput.className = "add-nombre";
  nombreInput.placeholder = "Nombre del negocio";

  const catInput = document.createElement("input");
  catInput.type = "text";
  catInput.className = "add-cat-input";
  catInput.placeholder = "Categoría (o varias separadas por coma)";
  const datalist = document.createElement("datalist");
  datalist.id = "categorias-datalist";
  CATEGORIAS.forEach(c=>{ const o=document.createElement("option"); o.value=c; datalist.appendChild(o); });
  catInput.setAttribute("list","categorias-datalist");

  const addBtn = document.createElement("button");
  addBtn.className = "btn primary";
  addBtn.textContent = "Agregar";

  function submit(){
    const nombre = nombreInput.value.trim();
    const cats = catInput.value.split(",").map(s=>s.trim()).filter(Boolean);
    if(!nombre){ nombreInput.focus(); return; }
    if(!cats.length){ catInput.focus(); return; }
    plaza.tenants.push({n:nombre, cat:cats});
    guardarDatos();
    render();
  }
  addBtn.addEventListener("click", submit);
  [nombreInput, catInput].forEach(inp=> inp.addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); }));

  wrap.appendChild(nombreInput);
  wrap.appendChild(catInput);
  wrap.appendChild(datalist);
  wrap.appendChild(addBtn);
  return wrap;
}

function render(){
  pintarSidebar();
  pintarPrincipal();
}

document.getElementById("buscar").addEventListener("input", (e)=>{ filtro = e.target.value; pintarSidebar(); });

document.getElementById("btn-reset").addEventListener("click", ()=>{
  if(!confirm("Esto borra tus cambios en este navegador y vuelve a los datos originales. ¿Seguro?")) return;
  DATA = JSON.parse(JSON.stringify(SEED));
  guardarDatos();
  plazaActivaId = null;
  render();
});

function generarMarkdown(){
  let out = "# Plazas — info real\n\n";
  for(const z of DATA){
    out += `## ${z.zona}\n\n`;
    for(const p of z.plazas){
      const icon = p.estado==="listo" ? "✅" : (p.estado==="revisar" ? "🈳" : "🔲");
      out += `### ${p.nombre} ${icon}\n`;
      if(!p.tenants.length){ out += "-\n\n"; continue; }
      for(const t of p.tenants) out += `- ${t.n} — ${t.cat.join(", ")}\n`;
      out += "\n";
    }
    out += "---\n\n";
  }
  return out.trim()+"\n";
}
function generarJSON(){
  const obj = {};
  for(const z of DATA) for(const p of z.plazas){
    obj[p.id] = p.tenants.map(t => ({n:t.n, cat: t.cat.length===1 ? t.cat[0] : t.cat}));
  }
  return JSON.stringify(obj, null, 2);
}

const modalBg = document.getElementById("modal-bg");
const exportText = document.getElementById("export-text");
let tabActiva = "md";
function refrescarExport(){
  exportText.value = tabActiva==="md" ? generarMarkdown() : generarJSON();
}
document.getElementById("btn-exportar").addEventListener("click", ()=>{
  modalBg.classList.remove("hidden");
  refrescarExport();
});
document.getElementById("btn-cerrar-modal").addEventListener("click", ()=> modalBg.classList.add("hidden"));
modalBg.addEventListener("click", (e)=>{ if(e.target===modalBg) modalBg.classList.add("hidden"); });
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    tabActiva = btn.dataset.tab;
    refrescarExport();
  });
});
document.getElementById("btn-copiar").addEventListener("click", async ()=>{
  await navigator.clipboard.writeText(exportText.value);
  const btn = document.getElementById("btn-copiar");
  const orig = btn.textContent; btn.textContent = "¡Copiado!";
  setTimeout(()=> btn.textContent = orig, 1200);
});
document.getElementById("btn-descargar").addEventListener("click", ()=>{
  const isMd = tabActiva==="md";
  const blob = new Blob([exportText.value], {type: isMd ? "text/markdown" : "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = isMd ? "investigacion-plazas.md" : "plazas-tenants.json";
  a.click();
  URL.revokeObjectURL(a.href);
});

render();
</script>
</body>
</html>
